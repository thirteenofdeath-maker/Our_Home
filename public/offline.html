<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#718d7a" />
    <title>Our Home — ออฟไลน์</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf8f2;
        color: #352e2c;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
        border-radius: 28px;
        background: #fff;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 8px 28px rgb(57 65 61 / 0.08);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #e4eee0;
        color: #4f7058;
        font-size: 30px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        margin: 10px 0 0;
        color: #807973;
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 16px;
        background: #789579;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⌂</div>
      <h1>ตอนนี้ไม่มีอินเทอร์เน็ต</h1>
      <p>
        หน้านี้ยังไม่เคยเปิดบนเครื่องนี้
        ลองเชื่อมต่ออินเทอร์เน็ตแล้วเปิดอีกครั้ง
      </p>
      <button type="button" onclick="location.reload()">
        ลองเชื่อมต่ออีกครั้ง
      </button>
    </main>
  </body>
</html>
